<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<title>trudny tryb 😱😱💀</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    overflow: hidden;

    background: black;

    font-family: Arial, sans-serif;
    
    touch-action: none;

}

#game {

    width: 100vw;

    height: 100vh;

    position: relative;

    overflow: hidden;

    background-image: url("bg.png");

    background-size: cover;

    background-position: center;

    animation: shake 0.12s infinite;

}


.player,
.enemy {

    position: absolute;

    width: 80px;

    height: 80px;

    object-fit: fill;

    user-select: none;

    pointer-events: none;

}


#timer {

    position: absolute;

    top: 10px;

    left: 10px;

    z-index: 10;

    color: white;

    background: black;

    border: 3px solid white;

    padding: 5px 10px;

    font-family: monospace;

    font-size: 24px;

}


/* PRZYCISK PAUZY */

#pauseBtn {

    position: absolute;

    top: 10px;

    right: 10px;

    z-index: 10;

    color: white;

    background: black;

    border: 3px solid white;

    padding: 5px 15px;

    font-family: monospace;

    font-size: 20px;

    cursor: pointer;

}


#pauseBtn:hover {

    background: #333;

}


/* EFEKT ŚLADU (TRAIL) */

.trail {

    position: absolute;

    width: 80px;

    height: 80px;

    object-fit: fill;

    user-select: none;

    pointer-events: none;

    opacity: 0.4;

    transition: opacity 0.3s ease;

}


@keyframes shake {

    0% {
        transform: translate(0, 0);
    }

    20% {
        transform: translate(2px, -2px);
    }

    40% {
        transform: translate(-2px, 1px);
    }

    60% {
        transform: translate(1px, 2px);
    }

    80% {
        transform: translate(-1px, -1px);
    }

    100% {
        transform: translate(0, 0);
    }

}


#gameOver, #pauseMenu {

    display: none;

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    background: white;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    color: black;

    font-family: "Times New Roman", serif;

    font-size: 48px;

    text-align: center;

    z-index: 20;

}


#pauseMenu {

    background: rgba(0, 0, 0, 0.85);

    color: white;

}


#finalTime {

    font-size: 20px;

    margin-top: 10px;

}


#gameOver button, #pauseMenu button {

    display: block;

    margin-top: 20px;

    padding: 5px 10px;

    font-family: "Times New Roman", serif;

    font-size: 16px;

    background: #eeeeee;

    color: black;

    border: 2px outset #aaaaaa;

    cursor: pointer;

}


#pauseMenu button {

    background: #333;

    color: white;

    border: 2px outset #666;

}


#gameOver button:hover {

    background: #dddddd;

}

</style>

</head>


<body>


<div id="game">


    <div id="timer">

        CZAS: 0.0

    </div>


    <button id="pauseBtn" onclick="togglePause()">

        II

    </button>


    <img
        id="player"
        class="player"
        src="sprite1.png"
    >


    <img
        id="enemy"
        class="enemy"
        src="sprite2.png"
    >


    <div id="gameOver">


        konec gry :(


        <div id="finalTime">

            przeżyłeś: 0.0 sekund

        </div>


        <button onclick="restartGame()">

            jeszcze raaz!!1!

        </button>


        <button onclick="goHome()">

            do domuu

        </button>


    </div>


    <div id="pauseMenu">

        PAUZA

        <button onclick="togglePause()">

            WZNOWIEŃ

        </button>

        <button onclick="goHome()">

            DO DOMU

        </button>

    </div>


</div>


<script>


const player =
    document.getElementById("player");


const enemy =
    document.getElementById("enemy");


const gameOver =
    document.getElementById("gameOver");


const pauseMenu =
    document.getElementById("pauseMenu");


const timer =
    document.getElementById("timer");


const finalTime =
    document.getElementById("finalTime");



/*
    DŹWIĘK
*/


const goodbyeSound =
    new Audio("goodbye.mp3");



const OBJECT_WIDTH = 80;

const OBJECT_HEIGHT = 80;



/*
    POZYCJE I DOCELOWE POZYCJE (DLA PŁYNNOŚCI / LERP)
*/


let playerX =
    window.innerWidth
    /
    2
    -
    OBJECT_WIDTH
    /
    2;


let playerY =
    window.innerHeight
    /
    2
    -
    OBJECT_HEIGHT
    /
    2;


let targetPlayerX = playerX;

let targetPlayerY = playerY;



let enemyX =
    Math.random()
    *
    (
        window.innerWidth
        -
        OBJECT_WIDTH
    );


let enemyY =
    Math.random()
    *
    (
        window.innerHeight
        -
        OBJECT_HEIGHT
    );



let gameRunning = true;

let isPaused = false;



let startTime =
    Date.now();


let survivalTime = 0;



const enemySpeed = 12;



/*
    STEROWANIE (MYSZKA I DOTYK) Z WYLICZANIEM CELU
*/

function updateTargetPosition(clientX, clientY) {

    targetPlayerX =

        clientX
        -
        OBJECT_WIDTH
        /
        2;



    targetPlayerY =

        clientY
        -
        OBJECT_HEIGHT
        /
        2;



    targetPlayerX = Math.max(

        0,

        Math.min(

            window.innerWidth
            -
            OBJECT_WIDTH,

            targetPlayerX

        )

    );


    targetPlayerY = Math.max(

        0,

        Math.min(

            window.innerHeight
            -
            OBJECT_HEIGHT,

            targetPlayerY

        )

    );

}


document.addEventListener(

    "mousemove",

    function(event) {

        if (!isPaused && gameRunning) {

            updateTargetPosition(event.clientX, event.clientY);

        }

    }

);


document.addEventListener(

    "touchmove",

    function(event) {

        if (!isPaused && gameRunning && event.touches.length > 0) {

            let touch = event.touches[0];

            updateTargetPosition(touch.clientX, touch.clientY);

        }

    },

    { passive: false }

);


document.addEventListener(

    "touchstart",

    function(event) {

        if (!isPaused && gameRunning && event.touches.length > 0) {

            let touch = event.touches[0];

            updateTargetPosition(touch.clientX, touch.clientY);

        }

    },

    { passive: false }

);



/*
    TWORZENIE EFEKTU ŚLADU (TRAIL)
*/

function createTrail(x, y, src) {

    let trail = document.createElement("img");

    trail.src = src;

    trail.className = "trail";

    trail.style.left = x + "px";

    trail.style.top = y + "px";

    document.getElementById("game").appendChild(trail);

    

    setTimeout(() => {

        trail.style.opacity = "0";

    }, 20);



    setTimeout(() => {

        trail.remove();

    }, 320);

}

let frameCount = 0;



/*
    KOLIZJA
*/


function checkCollision() {


    return (

        playerX
        <
        enemyX
        +
        OBJECT_WIDTH

        &&

        playerX
        +
        OBJECT_WIDTH
        >
        enemyX

        &&

        playerY
        <
        enemyY
        +
        OBJECT_HEIGHT

        &&

        playerY
        +
        OBJECT_HEIGHT
        >
        enemyY

    );

}



/*
    RUCH GRY
*/


function moveGame() {


    if (!gameRunning || isPaused) {

        return;

    }



    /*
        PŁYNNE PRZYBLIŻANIE DO MIEJSCA DOTYKOWEGO (LERP)
    */

    playerX += (targetPlayerX - playerX) * 0.3;

    playerY += (targetPlayerY - playerY) * 0.3;



    survivalTime =

        (

            Date.now()
            -
            startTime

        )
        /
        1000;



    timer.innerText =

        "CZAS: "
        +
        survivalTime.toFixed(1);



    player.style.left =

        playerX
        +
        "px";


    player.style.top =

        playerY
        +
        "px";



    /*
        PRZECIWNIK GONI GRACZA
    */


    let dx =

        playerX
        -
        enemyX;


    let dy =

        playerY
        -
        enemyY;


    let distance =

        Math.sqrt(

            dx * dx
            +
            dy * dy

        );



    if (

        distance
        >
        0

    ) {


        enemyX +=

            (

                dx
                /
                distance

            )
            *
            enemySpeed;



        enemyY +=

            (

                dy
                /
                distance

            )
            *
            enemySpeed;

    }



    enemy.style.left =

        enemyX
        +
        "px";


    enemy.style.top =

        enemyY
        +
        "px";



    /*
        CO KILKA KLATEK TWORZYMY ŚLAD
    */

    frameCount++;

    if (frameCount % 4 === 0) {

        createTrail(playerX, playerY, "sprite1.png");

        createTrail(enemyX, enemyY, "sprite2.png");

    }



    /*
        KOLIZJA
    */


    if (

        checkCollision()

    ) {

        endGame();

    }



    requestAnimationFrame(

        moveGame

    );

}



/*
    PAUZA
*/

function togglePause() {

    if (!gameRunning) return;

    

    isPaused = !isPaused;

    

    if (isPaused) {

        pauseMenu.style.display = "flex";

    } else {

        pauseMenu.style.display = "none";

        startTime += (Date.now() - pauseStartTime); // Korekta czasu pauzy
        
        moveGame();

    }

}

let pauseStartTime = 0;

/* Modyfikacja wejścia w pauzę by zapisać czas */
const originalTogglePause = togglePause;
togglePause = function() {
    if(!isPaused) {
        pauseStartTime = Date.now();
    }
    originalTogglePause();
}



/*
    KONIEC GRY
*/


function endGame() {


    gameRunning = false;



    finalTime.innerText =

        "przeżyłeś: "
        +
        survivalTime.toFixed(1)
        +
        " sekund";



    gameOver.style.display =

        "flex";



    goodbyeSound.currentTime = 0;



    goodbyeSound.play()
        .catch(

            function(error) {

                console.log(

                    "Dźwięk zablokowany:",

                    error

                );

            }

        );

}



/*
    RESTART
*/


function restartGame() {


    playerX =

        window.innerWidth
        /
        2
        -
        OBJECT_WIDTH
        /
        2;


    playerY =

        window.innerHeight
        /
        2
        -
        OBJECT_HEIGHT
        /
        2;


    targetPlayerX = playerX;

    targetPlayerY = playerY;



    enemyX =

        Math.random()
        *
        (

            window.innerWidth
            -
            OBJECT_WIDTH

        );


    enemyY =

        Math.random()
        *
        (

            window.innerHeight
            -
            OBJECT_HEIGHT

        );



    startTime =

        Date.now();



    survivalTime = 0;



    player.style.left =

        playerX
        +
        "px";


    player.style.top =

        playerY
        +
        "px";


    enemy.style.left =

        enemyX
        +
        "px";


    enemy.style.top =

        enemyY
        +
        "px";



    timer.innerText =

        "CZAS: 0.0";



    gameOver.style.display =

        "none";



    goodbyeSound.pause();

    goodbyeSound.currentTime = 0;



    gameRunning = true;

    isPaused = false;



    moveGame();

}



/*
    DO DOMU
*/


function goHome() {


    window.location.href =

        "../";

}



/*
    START
*/


moveGame();


</script>


</body>

</html>
